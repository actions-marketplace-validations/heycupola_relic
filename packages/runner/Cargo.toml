[package]
name = "relic-runner"
description = "The Relic Rust runner for injecting end-to-end encrypted secrets into local processes without writing .env files to disk."
authors = ["Can Vardar <https://github.com/heycupola/relic>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[dependencies]
libc = "0.2.182"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[lib]
crate-type = ["cdylib"]
